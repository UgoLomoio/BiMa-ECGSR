[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bima-ecgsr"
version = "0.1.0"
description = "12-lead ECG reconstruction from reduced lead sets with bidirectional Mamba models (BiMa-SR, DiBiMa-SR)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ugo Lomoio"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "wfdb>=4.1", "torch>=2.4", "diffusers>=0.30", "matplotlib>=3.8"]

[project.optional-dependencies]
gpu = ["mamba_ssm>=2.2", "causal_conv1d>=1.4"]
cpu = ["numba>=0.60"]
test = ["scikit-learn>=1.3"]

[tool.setuptools.packages.find]
include = ["bima_ecgsr*"]
